[project]
name = "kcp-protocol"
version = "0.1.0"
description = "Python implementation of the KCP (KERN Communications Protocol) protocol."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hardware and Software Platform, Champalimaud Foundation", email = "software@research.fchampalimaud.org" }
]
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

keywords = [
    "kcp",
    "protocol",
    "communication",
    "sauter",
    "fs2-20",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/fchampalimaud/kcp-protocol"
Repository = "https://github.com/fchampalimaud/kcp-protocol"
Issues = "https://github.com/fchampalimaud/kcp-protocol/issues"


[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
